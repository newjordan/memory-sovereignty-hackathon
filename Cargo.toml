[workspace]
resolver = "2"
members = [
  "crates/memsovereign",
  "crates/memsovereign-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = { version = "0.22", default-features = false, features = ["std"] }
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mime_guess = "2"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
zeroize = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
