[workspace]
resolver = "2"
members = [
  "crates/memsovereign",
  "crates/memsovereign-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.103"
base64 = { version = "0.23", default-features = false, features = ["std"] }
blake3 = "1"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["std", "sys_rng"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
mime_guess = "2"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
